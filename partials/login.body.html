  <main class="wrap">
    <div class="panel auth">
      <h2>Log in</h2>
      <p class="note">In the live service, parents sign in with national digital ID and a one-time code. Children use a read-only login their parent creates. This demo skips that.</p>
      <form class="form" id="demo-login">
        <div>
          <label for="profile">Choose a demo account</label>
          <select id="profile" name="profile" required>
            <option value="guardian">Parent of Kai, age 4 (today)</option>
            <option value="seedling">Amara, age 8 (simulated, 2030)</option>
            <option value="grower">Jaden, age 13 (simulated, 2035)</option>
            <option value="navigator">Shanice, age 17 (simulated, 2039)</option>
          </select>
          <p class="src">The first eligible children were born in November 2021, so older accounts are simulated futures.</p>
        </div>
        <button class="btn btn-ink" type="submit">Continue</button>
      </form>
    </div>
  </main>
